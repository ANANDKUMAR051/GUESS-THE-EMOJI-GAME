<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Multiplayer</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav"><a class="brand" href="menu.html">← Back</a><span class="badge">LIVE MULTIPLAYER</span></header>
<main class="game-shell"><div id="waiting" class="game-card"><div class="emoji-display">⚔️</div><h1>Find an opponent</h1><p id="status">Click below to join the matchmaking queue.</p><button id="find" class="btn primary">Find opponent</button></div>
<div id="match" class="game-card hidden"><div class="scoreboard"><div><b id="meName">You</b><strong id="meScore">0</strong></div><div><b id="opName">Opponent</b><strong id="opScore">0</strong></div></div><p id="mpRound">Round 1 / 5</p><div id="mpEmoji" class="emoji-display">❓</div><div class="guess-row"><input id="mpGuess" placeholder="Your answer"><button id="mpSubmit" class="btn primary">Submit</button></div><div id="mpFeedback" class="feedback"></div></div></main><script src="/socket.io/socket.io.js"></script><script src="multiplayer.js"></script></body></html>
