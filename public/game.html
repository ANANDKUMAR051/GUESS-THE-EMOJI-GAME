<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Solo Game</title><link rel="stylesheet" href="style.css"></head>
<body><header class="nav"><a class="brand" href="menu.html">← Back</a><div class="game-nav"><span id="timer">60s</span><span>Score: <b id="score">0</b></span></div></header>
